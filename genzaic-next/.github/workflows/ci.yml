name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint · Type-check · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: genzaic-next/package-lock.json

      - name: Install dependencies
        working-directory: genzaic-next
        run: npm ci

      - name: Lint
        working-directory: genzaic-next
        run: npm run lint

      - name: Type-check
        working-directory: genzaic-next
        run: npx tsc --noEmit

      - name: Build
        working-directory: genzaic-next
        env:
          # Build-time placeholders — the env.ts schema requires these to
          # exist but the build itself never connects to any of them.
          # Replace with secrets via `gh secret set ...` in real CI.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?sslmode=disable
          NEXTAUTH_SECRET: ci-placeholder-not-a-real-secret
          IMAGEKIT_PUBLIC_KEY: ci_placeholder
          IMAGEKIT_PRIVATE_KEY: ci_placeholder
          IMAGEKIT_URL_ENDPOINT: https://ik.imagekit.io/ci
          RESEND_API_KEY: ci_placeholder
          GOOGLE_AI_API_KEY: ci_placeholder
          RAZORPAY_KEY_ID: ci_placeholder
          RAZORPAY_KEY_SECRET: ci_placeholder
          NEXT_PUBLIC_APP_URL: http://localhost:3000
        run: npm run build
